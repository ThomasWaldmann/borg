# TEMPORARY: diagnose the extreme slowness of remote (rest://) tests on macOS
# runners, see #9470. Runs on the fork on every push to its branch.

name: macos-stdio-diag

on:
  push:
    branches: [ macos-stdio-diag ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.14'

    - name: Install macOS packages
      run: |
        brew unlink pkg-config@0.29.2 || true
        brew bundle install

    - name: Install borg
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.d/development.lock.txt
        pip install -e .

    - name: Fix hostname (round 4 - /etc/hosts alone did not help for a .local name)
      run: |
        set -ux
        echo "before: $(hostname)"
        time python -c "import socket; socket.getaddrinfo(socket.gethostname(), None, 0, socket.SOCK_DGRAM, 0, socket.AI_CANONNAME)" || true
        # the runner hostname is a long, unresolvable .local name; .local is mDNS
        # territory on macOS, so an /etc/hosts entry does not satisfy the canonical
        # name query (verified in round 3). Give the host a plain name instead.
        sudo scutil --set HostName borg-ci-mac
        echo "127.0.0.1 borg-ci-mac" | sudo tee -a /etc/hosts
        echo "after: $(hostname)"
        time python -c "import socket; socket.getaddrinfo(socket.gethostname(), None, 0, socket.SOCK_DGRAM, 0, socket.AI_CANONNAME)" || true
        time python -m borg --version
        time python -m borg --version
        echo "===== remote test after fix (was ~400s) ====="
        time pytest -v -p no:xdist --benchmark-skip "src/borg/testsuite/archiver/create_cmd_test.py::test_basic_functionality[remote_archiver]"

    - name: Decompose python process launch cost
      if: ${{ false }}  # round 2, kept for reference
      run: |
        set -uxo pipefail
        echo "===== bare interpreter launches (venv python = sys.executable) ====="
        time python -c pass
        time python -c pass
        PYEXE=$(python -c 'import sys; print(sys.executable)')
        echo "sys.executable: $PYEXE"
        echo "===== Python.app wrapper vs plain bin binary ====="
        FRAMEWORK=/Library/Frameworks/Python.framework/Versions/3.14
        ls -la "$FRAMEWORK/bin/python3.14" "$FRAMEWORK/Resources/Python.app/Contents/MacOS/Python" || true
        time "$FRAMEWORK/Resources/Python.app/Contents/MacOS/Python" -c pass || true
        time "$FRAMEWORK/Resources/Python.app/Contents/MacOS/Python" -c pass || true
        time "$FRAMEWORK/bin/python3.14" -c pass || true
        time "$FRAMEWORK/bin/python3.14" -c pass || true
        echo "===== preinstalled runner pythons for comparison ====="
        time /usr/bin/python3 -c pass || true
        BREWPY=$(brew --prefix 2>/dev/null)/bin/python3
        [ -x "$BREWPY" ] && time "$BREWPY" -c pass || true
        echo "===== borg startup (twice, warm) ====="
        time python -m borg --version
        time python -m borg --version
        echo "===== importtime breakdown, top 25 cumulative ====="
        python -X importtime -m borg --version 2> importtime.txt >/dev/null || true
        sort -t'|' -k2 -rn importtime.txt | head -25
        echo "===== mitigation test: disable gatekeeper assessment ====="
        sudo spctl --global-disable || sudo spctl --master-disable || true
        spctl --status || true
        time python -c pass
        time python -m borg --version
        time python -m borg --version
